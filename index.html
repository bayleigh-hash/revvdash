<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Short Form King · Revenue Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#080810;--surface:#0f0f1a;--s2:#141420;--border:#1c1c2e;--b2:#252538;--cyan:#00e5c8;--blue:#3d9eff;--amber:#f5a623;--red:#ff5555;--text:#ddddf0;--dim:#5a5a78;--muted:#28283c;}
*{margin:0;padding:0;box-sizing:border-box;}body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}a{text-decoration:none;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:15px 28px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:50;flex-wrap:wrap;gap:8px;}
.brand{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--text);}
.brand span{color:var(--dim);font-weight:400;}
.tr{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.tf{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;padding:5px 10px;border-radius:6px;border:1px solid var(--b2);background:transparent;color:var(--dim);cursor:pointer;transition:all .15s;}
.tf:hover{color:var(--text);background:var(--s2);}.tf.on{border-color:var(--cyan);color:var(--cyan);}
.di{background:var(--s2);border:1px solid var(--b2);color:var(--dim);font-family:'DM Sans',sans-serif;font-size:11px;padding:5px 8px;border-radius:6px;outline:none;width:115px;}
.di::-webkit-calendar-picker-indicator{filter:invert(.4);cursor:pointer;}
.dsep{color:var(--muted);font-size:11px;}
.rfb{display:flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--b2);color:var(--dim);font-family:'DM Sans',sans-serif;font-size:11px;padding:5px 10px;border-radius:6px;cursor:pointer;transition:all .15s;}
.rfb:hover{color:var(--text);}.rfb svg{transition:transform .5s;}.rfb:hover svg{transform:rotate(180deg);}
.nav{display:flex;gap:2px;padding:11px 28px;border-bottom:1px solid var(--border);background:var(--surface);}
.nav-link{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:7px 13px;border-radius:6px;color:var(--dim);transition:all .15s;border:1px solid transparent;}
.nav-link:hover{color:var(--text);background:var(--s2);}
.nav-link.active{color:var(--cyan);border-color:rgba(0,229,200,.2);background:rgba(0,229,200,.05);}
.main{padding:22px 28px;}
.hero{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:34px 38px;margin-bottom:18px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.hero::after{content:'';position:absolute;top:-70px;right:-70px;width:240px;height:240px;border-radius:50%;pointer-events:none;}
.hlbl{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-bottom:14px;display:flex;align-items:center;gap:7px;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.hval{font-family:'Space Mono',monospace;font-size:68px;font-weight:700;line-height:1;letter-spacing:-.03em;margin-bottom:12px;}
.hmeta{display:flex;gap:22px;align-items:center;flex-wrap:wrap;}
.hstat{font-size:13px;color:var(--dim);}.hstat strong{color:var(--text);font-weight:600;}
.hbadge{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;padding:5px 12px;border-radius:6px;}
.sgrid{display:grid;gap:13px;margin-bottom:18px;}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:17px 20px;}
.slbl{font-family:'Space Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:9px;}
.sv{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:5px;}
.ssub{font-size:11px;color:var(--dim);}
.bar-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 24px;margin-bottom:18px;}
.bh{display:flex;justify-content:space-between;margin-bottom:9px;}
.blbl{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);}
.bpct{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;}
.btrack{height:5px;background:var(--muted);border-radius:3px;overflow:hidden;margin-bottom:8px;}
.bfill{height:100%;border-radius:3px;transition:width 1.1s cubic-bezier(.4,0,.2,1);}
.bfoot{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);}
.tw{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:15px;}
.thead{padding:9px 24px;background:var(--s2);border-bottom:1px solid var(--border);display:grid;}
.th{font-family:'Space Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:right;}
.th:first-child{text-align:left;}
.tr2{padding:13px 24px;border-bottom:1px solid var(--border);display:grid;align-items:center;transition:background .12s;}
.tr2:last-child{border-bottom:none;}.tr2:hover{background:var(--s2);}
.rn{font-size:13px;font-weight:600;color:var(--text);}
.rv{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;text-align:right;}
.rv.cy{color:var(--cyan);}.rv.bl{color:var(--blue);}.rv.am{color:var(--amber);}.rv.rd{color:var(--red);}
.rv.dm{color:var(--dim);font-family:'DM Sans',sans-serif;font-weight:400;font-size:13px;}
.rv.mu{color:var(--muted);font-family:'DM Sans',sans-serif;font-weight:400;font-size:13px;}
.bwrap{display:flex;justify-content:flex-end;}
.badge{font-family:'Space Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.1em;padding:3px 7px;border-radius:4px;text-transform:uppercase;}
.badge.pif{background:rgba(0,229,200,.1);color:var(--cyan);border:1px solid rgba(0,229,200,.22);}
.badge.plan{background:rgba(61,158,255,.1);color:var(--blue);border:1px solid rgba(61,158,255,.22);}
.foot{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 19px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);}
.fi{width:21px;height:21px;background:var(--s2);border:1px solid var(--b2);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;}
strong.cy{color:var(--cyan);font-weight:600;}strong.bl{color:var(--blue);font-weight:600;}
strong.am{color:var(--amber);font-weight:600;}strong.rd{color:var(--red);font-weight:600;}
.xsep{color:var(--b2);}
.ldr{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:13px;z-index:100;transition:opacity .3s;}
.ldr.gone{opacity:0;pointer-events:none;}
.spin{width:30px;height:30px;border:2px solid var(--b2);border-radius:50%;animation:sp .75s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.ltxt{font-family:'Space Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.1em;}
.mbar{display:flex;flex-direction:column;gap:3px;align-items:flex-end;}
.mtrack{height:3px;background:var(--muted);border-radius:2px;overflow:hidden;width:76px;}
.mfill{height:100%;border-radius:2px;}
.mpct{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;text-align:right;}
.spin{border-top-color:var(--cyan);}</style>
</head>
<body>
<div class="ldr" id="ldr"><div class="spin"></div><div class="ltxt">LOADING...</div></div>
<div class="topbar">
  <div class="brand">SHORT FORM KING <span>· REVENUE DASHBOARD</span></div>
  <div class="tr">
<button class="tf on" data-f="all">All Time</button>
<button class="tf" data-f="today">Today</button>
<button class="tf" data-f="week">This Week</button>
<button class="tf" data-f="month">This Month</button>
<button class="tf" data-f="quarter">This Quarter</button>
<input type="date" class="di" id="dFrom">
<span class="dsep">→</span>
<input type="date" class="di" id="dTo">
<button class="rfb" onclick="render()"><svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M10.5 6A4.5 4.5 0 1 1 6 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M6 1.5L8 3.5M6 1.5L8 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Refresh</button>
</div>
</div>
<div class="nav" id="nav"></div>
<div class="main">
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:18px;">
  <div class="hero" style="margin:0;padding:22px 24px;"><div class="hlbl"><span class="dot" style="background:var(--cyan);box-shadow:0 0 6px var(--cyan)"></span>Cash Collected</div><div class="hval" id="vCash" style="font-size:36px;color:var(--cyan)">—</div><div class="hstat" id="sCash">—</div></div>
  <div class="hero" style="margin:0;padding:22px 24px;"><div class="hlbl"><span class="dot" style="background:var(--blue);box-shadow:0 0 6px var(--blue)"></span>Revenue Generated</div><div class="hval" id="vRev" style="font-size:36px;color:var(--blue)">—</div><div class="hstat" id="sRev">—</div></div>
  <div class="hero" style="margin:0;padding:22px 24px;"><div class="hlbl"><span class="dot" style="background:var(--amber);box-shadow:0 0 6px var(--amber)"></span>Balance Owing</div><div class="hval" id="vOwe" style="font-size:36px;color:var(--amber)">—</div><div class="hstat" id="sOwe">—</div></div>
</div>
<div class="bar-card">
  <div class="bh"><div class="blbl">Collection Rate · Cash vs Revenue</div><div class="bpct" id="bPct" style="color:var(--cyan)">—%</div></div>
  <div class="btrack"><div class="bfill" id="bFill" style="width:0%;background:var(--cyan);box-shadow:0 0 10px rgba(0,229,200,.4)"></div></div>
  <div class="bfoot"><span id="bL">—</span><span id="bR">—</span></div>
</div>
<div class="tw">
  <div class="thead" style="grid-template-columns:1fr 120px 120px 110px 80px;">
    <div class="th">Client</div><div class="th">Revenue</div><div class="th">Collected</div><div class="th">Owing</div><div class="th">Status</div>
  </div>
  <div id="tbody"></div>
</div>
<div class="foot"><div class="fi" style="color:var(--cyan)">✦</div><span id="ftxt">—</span></div>
</div>
<script>
const DEMO_DATA = [
  { name:'Jonty Watkin',    cash:500,  revenue:2000, owing:1500, notes:'PLAN', dateAdded:'2026-05-01T10:00:00Z' },
  { name:'Matt Simmonds',   cash:1500, revenue:2000, owing:500,  notes:'PLAN', dateAdded:'2026-05-03T10:00:00Z' },
  { name:'Steele Robinson', cash:200,  revenue:2000, owing:1800, notes:'PLAN', dateAdded:'2026-05-05T10:00:00Z' },
  { name:'Reece Oakley',    cash:2000, revenue:2000, owing:0,    notes:'PIF',  dateAdded:'2026-05-07T10:00:00Z' },
  { name:'Bradzen',         cash:2000, revenue:2000, owing:0,    notes:'PIF',  dateAdded:'2026-05-08T10:00:00Z' },
  { name:'Maika Steen',     cash:2000, revenue:2000, owing:0,    notes:'PIF',  dateAdded:'2026-05-10T10:00:00Z' },
  { name:'Ivan',            cash:2000, revenue:2000, owing:0,    notes:'PIF',  dateAdded:'2026-05-12T10:00:00Z' },
  { name:'Angus Blake',     cash:750,  revenue:2000, owing:1250, notes:'PLAN', dateAdded:'2026-05-14T10:00:00Z' },
  { name:'Jack Archibald',  cash:2000, revenue:2000, owing:0,    notes:'PIF',  dateAdded:'2026-05-16T10:00:00Z' },
];
function fmt(v){if(v===null||v===undefined||v===''||isNaN(v))return'—';return'AU$'+Number(v).toLocaleString('en-AU');}
function pct(a,b){if(!b||b===0)return 0;return Math.round((a/b)*1000)/10;}
function getDateRange(f,cf,ct){const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());if(f==='today')return{from:today,to:new Date(today.getTime()+86399999)};if(f==='week'){const day=today.getDay();const mon=new Date(today);mon.setDate(today.getDate()-((day+6)%7));const sun=new Date(mon);sun.setDate(mon.getDate()+6);return{from:mon,to:sun};}if(f==='month')return{from:new Date(now.getFullYear(),now.getMonth(),1),to:new Date(now.getFullYear(),now.getMonth()+1,0)};if(f==='quarter'){const q=Math.floor(now.getMonth()/3);return{from:new Date(now.getFullYear(),q*3,1),to:new Date(now.getFullYear(),q*3+3,0)};}if(f==='custom'&&cf)return{from:new Date(cf),to:ct?new Date(ct):now};return null;}
function filterData(data,f,cf,ct){const range=getDateRange(f,cf,ct);if(!range)return data;return data.filter(r=>{const d=new Date(r.dateAdded);return d>=range.from&&d<=range.to;});}
function filterLabel(f){return{all:'All time',today:'Today',week:'This week',month:'This month',quarter:'This quarter',custom:'Custom range'}[f]||'All time';}
function navHTML(active){const pages=[{id:'dashboard',label:'Dashboard',file:'index.html'},{id:'cash',label:'Cash Collected',file:'cash.html'},{id:'revenue',label:'Revenue Generated',file:'revenue.html'},{id:'owing',label:'Balance Owing',file:'owing.html'}];return pages.map(p=>`<a href="${p.file}" class="nav-link${p.id===active?' active':''}">${p.label}</a>`).join('');}


let filter='all',cfrom=null,cto=null;
document.getElementById('nav').innerHTML=navHTML('dashboard');
document.querySelectorAll('.tf').forEach(b=>{
  b.addEventListener('click',()=>{
    filter=b.dataset.f;cfrom=null;cto=null;
    document.getElementById('dFrom').value='';document.getElementById('dTo').value='';
    document.querySelectorAll('.tf').forEach(x=>x.classList.remove('on'));b.classList.add('on');render();
  });
});
document.getElementById('dFrom').addEventListener('change',()=>{cfrom=document.getElementById('dFrom').value;if(cfrom){filter='custom';document.querySelectorAll('.tf').forEach(x=>x.classList.remove('on'));render();}});
document.getElementById('dTo').addEventListener('change',()=>{cto=document.getElementById('dTo').value;if(cto){filter='custom';document.querySelectorAll('.tf').forEach(x=>x.classList.remove('on'));render();}});


function render(){
  const rows=filterData(DEMO_DATA,filter,cfrom,cto);
  const tc=rows.reduce((s,r)=>s+(r.cash||0),0);
  const tr=rows.reduce((s,r)=>s+(r.revenue||0),0);
  const to=rows.reduce((s,r)=>s+(r.owing||0),0);
  const rate=pct(tc,tr);
  const onPlan=rows.filter(r=>(r.notes||'').toUpperCase().includes('PLAN')).length;
  const pif=rows.length-onPlan;
  const lbl=filterLabel(filter);
  document.getElementById('vCash').textContent=fmt(tc);
  document.getElementById('sCash').innerHTML=`<strong>${rate}%</strong> of revenue · ${lbl}`;
  document.getElementById('vRev').textContent=fmt(tr);
  document.getElementById('sRev').innerHTML=`<strong>${rows.length}</strong> won deals · ${lbl}`;
  document.getElementById('vOwe').textContent=fmt(to);
  document.getElementById('sOwe').innerHTML=`<strong>${onPlan}</strong> on payment plans`;
  document.getElementById('bPct').textContent=rate+'%';
  document.getElementById('bL').textContent=fmt(tc)+' collected';
  document.getElementById('bR').textContent=fmt(tr)+' total';
  setTimeout(()=>document.getElementById('bFill').style.width=Math.min(rate,100)+'%',80);
  document.getElementById('tbody').innerHTML=rows.map(r=>{
    const ip=(r.notes||'').toUpperCase().includes('PLAN');
    return `<div class="tr2" style="grid-template-columns:1fr 120px 120px 110px 80px;">
      <div class="rn">${r.name}</div>
      <div class="rv dm">${fmt(r.revenue)}</div>
      <div class="rv cy">${fmt(r.cash)}</div>
      ${r.owing>0?`<div class="rv rd">${fmt(r.owing)}</div>`:`<div class="rv mu">—</div>`}
      <div class="bwrap"><span class="badge ${ip?'plan':'pif'}">${ip?'PLAN':'PIF'}</span></div>
    </div>`;
  }).join('');
  document.getElementById('ftxt').innerHTML=`<strong class="cy">${pif} clients</strong> paid in full <span class="xsep">·</span> <strong class="bl">${onPlan} clients</strong> on payment plans <span class="xsep">·</span> <strong class="am">${fmt(to)}</strong> outstanding`;
  document.getElementById('ldr').classList.add('gone');
}

render();
</script>
</body>
</html>
